[project]
name = "6dpose"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=5.0.0",
    "huggingface-hub>=1.20.1",
    "hydra-core>=1.3.4",
    "matplotlib>=3.11.0",
    "numpy>=2.5.0",
    "open3d>=0.19.0",
    "opencv-contrib-python>=5.0.0.93",
    "optuna>=4.9.0",
    "pyrealsense2>=2.58.2.10647",
    "torch>=2.12.1",
    "trimesh>=4.12.2",
    "ultralytics>=8.4.75",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

[tool.uv]
override-dependencies = [
    "opencv-python; sys_platform == 'never'"
]
