[project]
name = "6dpose"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=5.0.0",
    "huggingface-hub>=1.20.1",
    "matplotlib>=3.11.0",
    "numpy>=2.5.0",
    "open3d>=0.19.0",
    "opencv-contrib-python>=5.0.0.93",
    "optuna>=4.9.0,<5.0.0",
    "plotly>=6.0.0",
    "pyrealsense2>=2.58.2.10647",
    "torch>=2.12.1",
    "trimesh>=4.12.2",
    "ultralytics>=8.4.75",
    "pydantic>=2.0.0",
    "pytest>=8.0.0",
    "scipy>=1.14.0",
    "tyro>=1.0.15",
    "wandb>=0.28.1",
    "optuna-integration[wandb]>=4.9.0",
    "shapely>=2.1.2",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

[tool.uv]
override-dependencies = [
    "opencv-python; sys_platform == 'never'"
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "N"]
ignore = ["N806", "N803", "N802", "UP007", "E501"] # Allow uppercase matrix/math notation, tyro Unions, and comment line-lengths



[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["methods", "utils", "cli_config"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

