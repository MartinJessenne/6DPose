# @package _global_
depth_trunc: 2.2

model:
  _target_: methods.ransac3dof.Ransac3DoFEstimator
  params:
    voxel_size: 0.04
    ransac_max_iterations: 2772
    icp_max_correspondence_distance: 0.06404478356487074
    icp_max_iterations: 50
    # Height of the CAD model origin above the ground plane in the robot base
    # frame. 0.0 assumes the CAD origin sits on the floor.
    # null derives the offset per cart from the CAD mesh (-min vertex z, model
    # resting on the floor); set a float to override manually.
    # 0.01: measured scene constant — the sim floor sits 1cm above base_link z=0
    # (benchmark trans_z bias was -0.0099, exactly zeroed by this value).
    z_offset: 0.01
    # Half-width of the z-consistency gate on FPFH correspondences (sensor
    # z-noise property, decoupled from voxel_size).
    z_gate_threshold: 0.12938125580720045
    edge_length_threshold: 0.831518113921687
    # When set (meters), register against only the front slab of the CAD mesh
    # (towing face at +x in the CAD frame) — asymmetric, so it disambiguates
    # 180-degree flips. null uses the full mesh.
    # A/B on 40 samples (seed 42): AR 0.069 -> 0.154, flip rate 45.9% -> 21.4%.
    front_crop_depth: 0.47964349266741707
    ransac_confidence: 0.999
    # Fixed seed for reproducible benchmarks; set to null for non-deterministic runs.
    seed: 0
  extrinsic: ${camera.extrinsic}
