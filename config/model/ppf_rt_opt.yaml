# @package _global_
depth_trunc: 3.8

model:
  _target_: methods.ppf.PPFEstimator
  params:
    ppf_sampling_step: 0.03
    ppf_distance_step: 0.06
    ppf_match_threshold: 0.04
    ppf_match_tolerance: 0.08
    # Optimized value obtained from Optuna hyperparameter sweep PPFNewSweep (Trial #32)
    # Optimized for near-real-time deployment (p95 latency ~0.19s, BOP-style AR ~1.2%)
    icp_max_correspondence_distance: 0.1724415146443418
    icp_max_iterations: 60
  extrinsic: ${camera.extrinsic}
