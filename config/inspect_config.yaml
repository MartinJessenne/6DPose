defaults:
  - config
  - _self_

hydra:
  help:
    template: |
      6D Pose Validation & Inspection Utility (inspect_pose.py)
      =========================================================
      
      This script acts as the main execution and debugging interface for the 6D Pose Estimation
      pipeline. It loads the Parquet dataset, runs YOLO segmentation, reconstructs 3D point clouds,
      aligns reference CAD models using PPF or RANSAC, and compares predictions against Isaac Sim ground truths.
      
      Usage Modes:
        * mode=random
          Selects random samples from the dataset test split and exports GLB visualizer scenes.
        * mode=indices
          Runs targeted inspection on specific test set indices (0-1481) and exports yolo predictions (PNG),
          reconstructed point clouds (PLY), and combined scenes (GLB).
      
      Command Line Overrides:
        mode=random|indices       Set the execution mode.
        random_samples=N          Number of random samples to run in random mode (default: 10).
        indices=[idx1,idx2,...]   List of specific sample indices to run in indices mode.
        model=ppf|ransac          Select matching algorithm configuration (default: ppf).
        output_dir=path/          Directory to write debug outputs (default: debug_output/).
      
      Examples:
        # Run 5 random samples using the RANSAC estimator:
        uv run inspect_pose.py mode=random random_samples=5 model=ransac
        
        # Run targeted debug on indices 37 and 52 using the PPF estimator:
        uv run inspect_pose.py mode=indices indices=[37,52] model=ppf
      
      --------------------------------------------------------------------------------
      Active Configuration Values:
      --------------------------------------------------------------------------------
      model: ${hydra:runtime.choices.model}
      dataset: ${hydra:runtime.choices.dataset}
      camera: ${hydra:runtime.choices.camera}
      mode: ${mode}
      random_samples: ${random_samples}
      indices: ${indices}
      output_dir: ${output_dir}
