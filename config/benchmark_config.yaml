defaults:
  - config
  - _self_

hydra:
  help:
    template: |
      6D Pose Estimation Benchmark & Tuning Suite (benchmark.py)
      ==========================================================
      
      This script evaluates and optimizes 6D Pose Estimation algorithms (such as PPF and RANSAC)
      against ground truth labels from Isaac Sim.
      
      Usage Modes:
        * sweep=false (Default)
          Runs a standard evaluation benchmark on a random selection of test samples.
        * sweep=true
          Launches an Optuna multi-objective parameter sweep to optimize accuracy and speed.
      
      Command Line Overrides:
        sweep=true|false          Flag to execute the Optuna hyperparameter sweep (default: false).
        eval_size=N               Number of validation samples to evaluate per trial/benchmark (default: 20).
        model=ppf|ransac          Select matching algorithm configuration (default: ppf).
        trials=N                  Number of optimization trials to execute if sweep=true (default: 30).
        name=STR                  Custom name for the Optuna study/database name (default: "Sweep").
        seed=N                    Optional random seed to ensure reproducible sweeps/evals.
      
      Examples:
        # Benchmark the default RANSAC config on 50 samples:
        uv run benchmark.py model=ransac eval_size=50
        
        # Run an Optuna sweep of 100 trials for PPF:
        uv run benchmark.py model=ppf sweep=true trials=100 name=PPF_Sweep
        
        # Run a reproducible benchmark with a fixed seed:
        uv run benchmark.py model=ransac eval_size=10 seed=42
      
      --------------------------------------------------------------------------------
      Active Configuration Values:
      --------------------------------------------------------------------------------
      model: ${hydra:runtime.choices.model}
      dataset: ${hydra:runtime.choices.dataset}
      camera: ${hydra:runtime.choices.camera}
      sweep: ${sweep}
      eval_size: ${eval_size}
      trials: ${trials}
      name: ${name}
      seed: ${seed}
