site_name: 6DPose Project Documentation
theme:
  name: material
  palette:
    - scheme: slate
      primary: teal
      accent: cyan
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: true
            docstring_style: google

nav:
  - Home: index.md
  - Tutorials:
    - Overview: tutorials/index.md
    - Visualizing the 3D Pipeline: tutorials/01_pose_estimation.md
    - Comparing RANSAC vs PPF: tutorials/02_method_comparison.md
    - Configuration with tyro: tutorials/03_config_system.md
  - How-to Guides:
    - Overview: how-to/index.md
    - Add a New Model: how-to/add_estimator.md
    - Run Parameter Sweeps: how-to/run_sweeps.md
  - Explanation:
    - Overview: explanation/index.md
    - System Architecture: explanation/architecture.md
    - Coordinate Frames & Math: explanation/coordinate_frames.md
    - Pipeline Symmetries & Sinks: explanation/limitations.md
    - Configuration with tyro: explanation/tyro_cli_config.md
    - Experiment Tracking with W&B: explanation/wandb_tracking.md
  - API Reference:
    - Overview: reference/index.md
    - Core Pipeline (pipeline): reference/pipeline.md
    - Base Estimators (base): reference/base.md
    - RANSAC Estimator: reference/ransac.md
    - PPF Estimator: reference/ppf.md
